<!doctype html>
<html lang="ko" class="hs-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#663b21">
  <title>한지 일러스트 시안 — 여우굴 양조장</title>
  <link rel="stylesheet" href="./hanji-study.css?v=landscape02">
  <link rel="preload" href="/foxcave/media/hanji/hayang-table-bottle-fixed-painted.jpg" as="image">
  <script src="./hanji-study.js?v=package03" defer></script>
  <script src="./hanji-series.js?v=landscape01" defer></script>
  <script src="./hanji-photos.js?v=1" defer></script>
</head>
<body class="hs-page">
  <a class="hs-skip" href="#hs-main">본문으로 바로가기</a>
  <header class="hs-header">
    <div class="hs-header-inner">
      <a class="hs-brand" href="/foxcave/" aria-label="여우굴 양조장 홈페이지">
        <img src="/foxcave/media/brand/header-lockup.svg" alt="여우굴 양조장" width="174" height="40">
      </a>
      <a class="hs-home-link" href="/foxcave/">홈페이지 보기 <span aria-hidden="true">▸</span></a>
    </div>
  </header>

  <main id="hs-main">
    <section class="hs-series" aria-labelledby="hs-series-title">
      <div class="hs-series-heading">
        <h2 id="hs-series-title">가로 그림 6장</h2>
        <p aria-live="polite"><span id="hs-series-count">0</span><span aria-hidden="true"> / </span><span class="hs-sr-only">장 완료, 전체 </span>6<span class="hs-sr-only">장</span></p>
      </div>
      <p class="hs-series-empty" id="hs-series-empty" role="status">새 그림을 준비하고 있어요.</p>
      <div id="hs-series-ready" hidden>
        <figure class="hs-series-viewer">
          <a class="hs-series-frame" id="hs-series-image-link" target="_blank" rel="noopener" aria-label="선택한 그림 원본 보기, 새 창">
            <img id="hs-series-image" alt="" width="1536" height="1024">
          </a>
          <figcaption>
            <p><span class="hs-series-number" id="hs-series-number"></span><span id="hs-series-name"></span></p>
            <a id="hs-series-original" target="_blank" rel="noopener">원본 보기 <span aria-hidden="true">▸</span><span class="hs-sr-only"> (새 창)</span></a>
          </figcaption>
        </figure>
        <div class="hs-series-thumbnails" id="hs-series-thumbnails" role="group" aria-label="새 그림 선택"></div>
      </div>
    </section>

    <section class="hs-gallery hs-photo-studies" id="photo-studies" aria-labelledby="hs-photo-title">
      <div class="hs-gallery-heading">
        <h2 id="hs-photo-title">상세페이지 사진으로 그린 그림</h2>
        <p aria-live="polite"><span id="hs-photo-count">0</span> / 18</p>
      </div>
      <div class="hs-photo-filters" role="group" aria-label="그림 주제 선택">
        <button type="button" data-photo-filter="all" aria-pressed="true">전체</button>
        <button type="button" data-photo-filter="product" aria-pressed="false">하양한모금</button>
        <button type="button" data-photo-filter="class" aria-pressed="false">원데이클래스</button>
      </div>
      <div class="hs-gallery-grid" id="hs-photo-grid"></div>
    </section>

    <div class="hs-study-bar">
      <p>한지 일러스트 시안</p>
      <div class="hs-subjects" role="group" aria-label="배너 주제 선택">
        <button type="button" class="hs-subject" data-hs-subject="product" aria-pressed="true" aria-controls="hs-banner">하양한모금</button>
        <button type="button" class="hs-subject" data-hs-subject="class" aria-pressed="false" aria-controls="hs-banner">막걸리 클래스</button>
      </div>
    </div>

    <section class="hs-banner" id="hs-banner" aria-labelledby="hs-title">
      <div class="hs-banner-copy">
        <div class="hs-copy-inner">
          <h1 id="hs-title"><span id="hs-title-first">바삭한 전 한 접시</span><br><span id="hs-title-second">곁들이는 하양한모금</span></h1>
          <p class="hs-description" id="hs-description">한 달의 발효·숙성으로 빚었습니다.<br>맑고 가벼운 목넘김, 깔끔하게 남는 끝맛.</p>
          <a class="hs-banner-link" id="hs-banner-link" href="/foxcave/product/"><span id="hs-link-label">하양한모금 알아보기</span><span aria-hidden="true">▸</span></a>
        </div>
      </div>
      <figure class="hs-banner-art">
        <img id="hs-banner-image" src="/foxcave/media/hanji/hayang-table-bottle-fixed-painted.jpg" alt="하양한모금과 전을 차린 식탁을 한지 질감으로 표현한 일러스트" width="1536" height="1024" fetchpriority="high">
      </figure>
    </section>

    <section class="hs-gallery" aria-labelledby="hs-gallery-title">
      <div class="hs-gallery-heading">
        <h2 id="hs-gallery-title">그림 자세히 보기</h2>
        <p>한지의 결, 번지는 색, 오려 붙인 듯한 형태.</p>
      </div>
      <div class="hs-gallery-grid">
        <figure class="hs-gallery-item">
          <a class="hs-gallery-image" href="/foxcave/media/hanji/hayang-table-bottle-fixed-painted.jpg" target="_blank" rel="noopener" aria-label="하양한모금 일러스트 원본 보기, 새 창">
            <img src="/foxcave/media/hanji/hayang-table-bottle-fixed-painted.jpg" alt="하양한모금과 전을 차린 식탁 일러스트 원본" width="1536" height="1024" loading="lazy">
          </a>
          <figcaption><span>하양한모금</span><a href="/foxcave/media/hanji/hayang-table-bottle-fixed-painted.jpg" target="_blank" rel="noopener">원본 보기 <span aria-hidden="true">▸</span><span class="hs-sr-only"> (새 창)</span></a></figcaption>
        </figure>
        <figure class="hs-gallery-item">
          <a class="hs-gallery-image" href="/foxcave/media/hanji/brewing-class.jpg" target="_blank" rel="noopener" aria-label="막걸리 클래스 일러스트 원본 보기, 새 창">
            <img src="/foxcave/media/hanji/brewing-class.jpg" alt="쌀과 누룩을 섞어 막걸리를 빚는 한지 질감 일러스트 원본" width="1536" height="1024" loading="lazy">
          </a>
          <figcaption><span>막걸리 클래스</span><a href="/foxcave/media/hanji/brewing-class.jpg" target="_blank" rel="noopener">원본 보기 <span aria-hidden="true">▸</span><span class="hs-sr-only"> (새 창)</span></a></figcaption>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
